name: Daily Signal Scan

on:
  schedule:
    # 8:00 AM EDT  = 12:00 UTC  (summer)
    - cron: "0 12 * * *"
    # 8:00 PM EDT  = 00:00 UTC  (midnight)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    env:
      MASSIVE_API_KEY:    ${{ secrets.MASSIVE_API_KEY }}
      FMP_API_KEY:        ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run LEAPS scan (20d)
        run: python predict.py --report

      - name: Run swing scan (5d)
        run: python predict.py --mode swing --report

      - name: Run daily scan (3d)
        run: python predict.py --mode daily --report

      - name: Commit reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/reports/
          git diff --cached --quiet && echo "No report changes" || \
            git commit -m "chore: daily signal report $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Send email notification
        run: python -m src.notify
